<body>
  <style>
    body {
      background-color: #030303;
    }
  </style>


<div id="loading">
  <style>
    body {
      inset: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
    }

    #loading {
      align-items: center;
      display: flex;
      height: 100%;
      justify-content: center;
      width: 100%;
      background-color: #2f384c;
      overflow: hidden;
    }

    #loading img {
      animation: zoomInOut 1.2s ease-in-out infinite alternate;
      opacity: .8;
      transition: opacity .4s;
      width: 100px; 
      height: 100px;
      border-radius: 50%; 
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    }

    @keyframes zoomInOut {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
  <img src="icons/app_icon_white_transparent.png" alt="PostMage" />
</div>

<script>
  window.addEventListener('load', function () {
    var loading = document.querySelector('#loading');
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      }
    }).then(function (engineInitializer) {
      loading.classList.add('main_done');
      return engineInitializer.initializeEngine();
    }).then(function (appRunner) {
      loading.classList.add('init_done');
      return appRunner.runApp();
    }).then(function (app) {
      // Wait a few milliseconds so users can see the animation before hiding the "loading" div.
      setTimeout(function () {
        loading.style.opacity = '0';
        loading.style.pointerEvents = 'none'; // Optional: Prevent interaction with elements behind
      }, 200); // Adjust timing as needed
    });
  });
</script>

  <script>
    window.addEventListener('load', function () {

      _flutter.loader.loadEntrypoint({
        serviceWorker: {

        }

        loading.classList.add('main_done');

      }).then(function (appRunner) {
        loading.classList.add('init_done');
        return appRunner.runApp();
      }).then(function (app) {
        // Wait a few milliseconds so users can see the "zoooom" animation
        // before getting rid of the "loading" div.
        window.setTimeout(function () {
          loading.classList.add('remove-animation');
          // Alternatively, you can use loading.remove() here instead of the class addition
        }, 200);
      });
    });
  </script>
